name: Discover public ACT plugins
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discover-release-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x
      - run: dotnet build discovery/Inspector.csproj -c Release --configfile NuGet.Config
      - name: Inspect public releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 discovery/discover.py discovery/bin/Release/net8.0/Inspector.dll
      - name: Publish changed catalog
        shell: bash
        run: |
          if git diff --quiet -- catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- catalog.json
          git commit -m 'Refresh public ACT plugin catalog'
          git push origin HEAD:main
